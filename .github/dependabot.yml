version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - '🤖 Dependencies'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    labels:
      - '🤖 Dependencies'
    ignore:
      # typescript-eslint peers on typescript <6.1.0, so TS 7 cannot install at all.
      # Lift once typescript-eslint ships support.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
