name: CI Package

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: gofiber/multi-labeler workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm install
      - run: npm run build
      - run: npm run package

      # Last line of defence: main must never carry a bundle that its lockfile
      # no longer produces. Dependency PRs get theirs rebuilt before the merge
      # in dependabot-dist.yml, so reaching this error means a merge slipped
      # past that.
      # Scoped to dist: npm install may touch the lockfile, and that is not what
      # this check is about.
      - run: git diff --exit-code -- dist || (echo "::error ::dist is out of sync with package-lock.json on main" && exit 1)
